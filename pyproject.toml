[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hopforge"
version = "0.7.0"
description = "Forge any tight-binding Hamiltonian: 1D-3D models, bands, topology (Chern, Z2, Wilson loops) and Kubo Hall responses (AHC/SHC/OHC), with tutorials and quizzes."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Gokaran Shukla", email = "gokaran.shukla@kaust.edu.sa"}]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5", "sympy>=1.9", "threadpoolctl>=3"]
keywords = ["tight-binding", "condensed matter", "topology", "Berry curvature", "Chern number", "Z2", "spin Hall", "orbital Hall"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
notebooks = ["jupyter", "ipywidgets"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Gokaran-Shukla/hopforge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hopforge = ["quizzes/*.json"]
